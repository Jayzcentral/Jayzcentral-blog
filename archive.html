<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Archive - Jayzcentral</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            body {
                background-color: #008080;
                margin: 0;
                padding: 20px 20px 60px 20px;
                font-family: "Helvetica Neue", Arial, sans-serif;
                color: #000;
            }

            a {
                color: #000000;
                text-decoration: none;
            }

            /* Main Win98 Container */
            .archive-container {
                max-width: 900px;
                margin: 0 auto;
                background-color: #c0c0c0;
                border-top: 2px solid #ffffff;
                border-left: 2px solid #ffffff;
                border-right: 2px solid #404040;
                border-bottom: 2px solid #404040;
                box-shadow: 2px 2px 0px 0px #000000;
            }

            /* Title Bar */
            .title-bar {
                height: 24px;
                background: linear-gradient(90deg, #000080, #1084d0);
                color: white;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 6px;
                font-weight: bold;
                font-size: 12px;
            }

            .title-bar a {
                color: #ffffff;
                background: #c0c0c0;
                color: #000;
                border-top: 1px solid #ffffff;
                border-left: 1px solid #ffffff;
                border-right: 1px solid #404040;
                border-bottom: 1px solid #404040;
                padding: 0 4px;
                font-size: 10px;
            }

            .archive-content {
                padding: 16px;
                background: #ffffff;
                border-top: 1px solid #404040;
                border-left: 1px solid #404040;
                border-right: 1px solid #ffffff;
                border-bottom: 1px solid #ffffff;
                margin: 4px;
            }

            /* Month Sections */
            .month-section {
                margin-bottom: 30px;
            }

            .month-title {
                font-size: 14px;
                font-weight: bold;
                border-bottom: 2px solid #000080;
                padding-bottom: 4px;
                margin-bottom: 12px;
                color: #000080;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .month-count {
                font-size: 11px;
                color: #666;
                font-weight: normal;
            }

            /* Thumbnail Grid */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .grid-item {
                position: relative;
                aspect-ratio: 1 / 1;
                background-color: #e0e0e0;
                border: 2px inset #ffffff;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .grid-item img, .grid-item video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.2s ease;
            }

            .grid-item:hover img {
                transform: scale(1.05);
            }

            /* Media Type Badges */
            .badge {
                position: absolute;
                bottom: 4px;
                right: 4px;
                background: rgba(0,0,0,0.7);
                color: white;
                font-size: 9px;
                padding: 2px 4px;
                font-weight: bold;
                border-radius: 2px;
                text-transform: uppercase;
            }

            /* Win98 Taskbar */
            .retro-status-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 30px;
                background-color: #c0c0c0;
                border-top: 2px solid #ffffff;
                display: flex;
                align-items: center;
                padding: 0 5px;
                box-sizing: border-box;
                font-family: "MS Sans Serif", Tahoma, sans-serif;
                font-size: 12px;
                z-index: 99999;
            }

            .start-btn {
                background-color: #c0c0c0;
                border-top: 2px solid #ffffff;
                border-left: 2px solid #ffffff;
                border-right: 2px solid #404040;
                border-bottom: 2px solid #404040;
                padding: 2px 8px;
                font-weight: bold;
                cursor: pointer;
                margin-right: 10px;
            }

            .status-text {
                background-color: #ffffff;
                border-top: 2px solid #404040;
                border-left: 2px solid #404040;
                border-right: 2px solid #ffffff;
                border-bottom: 2px solid #ffffff;
                padding: 2px 8px;
                flex-grow: 1;
            }
        </style>
    </head>
    <body>

        <div class="archive-container">
            <div class="title-bar">
                <span>C:\JAYZCENTRAL\ARCHIVE.EXE</span>
                <a href="index.html">← Back to Main Feed</a>
            </div>

            <div class="archive-content">

                <!-- OCTOBER 2026 -->
                <div class="month-section">
                    <div class="month-title">
                        <span>October 2026</span>
                        <span class="month-count">2 Posts</span>
                    </div>
                    <div class="grid">
                        <a href="index.html#post-oct-1" class="grid-item">
                            <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300" alt="Post Scan" />
                            <span class="badge">Photo</span>
                        </a>
                        <a href="index.html#post-oct-2" class="grid-item">
                            <img src="https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif" alt="Post GIF" />
                            <span class="badge">GIF</span>
                        </a>
                    </div>
                </div>

                <!-- SEPTEMBER 2026 -->
                <div class="month-section">
                    <div class="month-title">
                        <span>September 2026</span>
                        <span class="month-count">3 Posts</span>
                    </div>
                    <div class="grid">
                        <a href="index.html#post-sep-1" class="grid-item">
                            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" alt="Post Image" />
                            <span class="badge">Photo</span>
                        </a>
                        <a href="index.html#post-sep-2" class="grid-item">
                            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/0.jpg" alt="Video Thumb" />
                            <span class="badge">Video</span>
                        </a>
                        <a href="index.html#post-sep-3" class="grid-item">
                            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" alt="Post Image" />
                            <span class="badge">Photo</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>

        <!-- Taskbar -->
        <div class="retro-status-bar">
            <div class="start-btn"><span style="color: #000080;">❖</span> Start</div>
            <div class="status-text" id="statusTime">System Status: Archive Online</div>
        </div>

        <script>
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                document.getElementById('statusTime').innerText = `System Status: Archive Online — ${hours}:${minutes} ${ampm}`;
            }
            setInterval(updateClock, 1000);
            updateClock();
        </script>
    </body>
</html>
